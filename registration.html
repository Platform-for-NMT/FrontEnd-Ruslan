<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація</title>
    <link rel="stylesheet" href="registration.css">
    <link rel="stylesheeto-" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <a href="#" class="back-link">← Back to home</a>
            <div class="form-container" style="width: 694px;">
                <h1>Реєстрація</h1>
                <form>
                    <div class="form-group">
                        <input style="height: 65px; border: 1px solid #8E5EE7; border-radius: 13px" type="text" id="fullname" placeholder="ПІБ" required>
                    </div>
                    <div class="form-group">
                        <input style="height: 65px; border: 1px solid #8E5EE7; border-radius: 13px" type="email" id="email" placeholder="Ел. пошта" required>
                    </div>
                    <div class="form-group password-group">
                        <input style="height: 65px; border: 1px solid #8E5EE7; border-radius: 13px" type="password" id="password" placeholder="Пароль" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                    <div class="form-group password-group">
                        <input style="height: 65px; border: 1px solid #8E5EE7; border-radius: 13px" type="password" id="confirm-password" placeholder="Підтвердити пароль" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                    <button style="border-radius: 12px;" type="submit" class="register-btn">Зареєструватись</button>
                </form>
                <div class="divider">
                    <span>або</span>
                </div>
                <div class="social-login">
                    <button class="social-btn google">
                        <img style="width: 35px;" src="photos/google-icon.png" alt="">
                    </button>
                    <button class="social-btn apple">
                        <img style="width: 35px;" src="photos/apple-icon.png" alt="">
                    </button>
                    <button class="social-btn telegram">
                        <img style="width: 35px;" src="photos/telegram-icon.png" alt="">
                    </button>
                </div>
                <p class="login-link">Вже зареєстровані? <a href="#">Увійти</a></p>
            </div>
        </div>
        <div class="right-panel">
            <div class="grid-pattern"></div>
            <div class="cat-image">
                <img class="fon" src="photos/fon.png" alt="фон">
                <img class="cat" src="photos/cat.png" alt="кішечка">
            </div>
        </div>
    </div>
</body>

</html>
